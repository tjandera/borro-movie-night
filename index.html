<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Borro: Movie Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
@layer base {
  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }
  html,
  body {
    height: 100%;
    background: #12160f;
    color: #f4ede2;
  }
}

.reel {
  display: grid;
  height: 100vh;
  height: 100dvh;
  place-items: center;
  background: #12160f;
  padding: 0.6rem;
}

.reel-frame {
  position: relative;
  width: min(1120px, 100%);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 0.8rem;
  background: #1a2740;
}

.reel-frame[data-mode="tall"] {
  width: min(100%, calc((100dvh - 1.2rem) * 780 / 1240));
  aspect-ratio: 780 / 1240;
}

.reel-frame canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.reel-play {
  position: absolute;
  top: 46%;
  left: 50%;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  transform: translate(-50%, -50%);
  border: 0;
  border-radius: 999px;
  background: #f4ede2;
  color: #1c1915;
  padding: 0.85rem 1.3rem;
  font: 650 1.05rem Outfit, sans-serif;
  box-shadow: 0 12px 30px rgb(0 0 0 / 0.28);
}

.reel-cap {
  position: absolute;
  bottom: 3.6rem;
  left: 50%;
  width: min(40rem, 92%);
  transform: translateX(-50%);
  border-radius: 0.7rem;
  background: rgb(16 14 12 / 0.82);
  color: #f4ede2;
  padding: 0.45rem 0.75rem;
  text-align: center;
  font: 500 0.95rem/1.35 Outfit, sans-serif;
}

.reel-controls {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 1.6rem 0.7rem 0.55rem;
  background: linear-gradient(to top, rgb(12 10 8 / 0.72), transparent);
  color: #f4ede2;
}

.reel-icon {
  display: grid;
  width: 2rem;
  height: 2rem;
  flex: none;
  place-items: center;
  border: 0;
  border-radius: 999px;
  background: rgb(244 237 226 / 0.14);
  color: #f4ede2;
}

.reel-time,
.reel-chapter {
  flex: none;
  font: 500 0.75rem Outfit, sans-serif;
}

.reel-chapter {
  display: none;
}

.reel-scrub {
  min-width: 0;
  flex: 1;
  accent-color: #e7a24a;
}

@media (min-width: 800px) {
  .reel-chapter {
    display: block;
    max-width: 9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}



</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
</body>
</html>
